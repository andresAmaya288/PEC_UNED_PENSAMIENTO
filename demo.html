<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<title>Demo Cerillas — Motor nuevo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:30px 20px;}
h1{font-size:18px;text-align:center;margin-bottom:5px;}
.subt{text-align:center;color:#666;margin-bottom:20px;font-size:12px;}
.eq-wrap{background:white;border:1px solid #ddd;border-radius:12px;padding:44px 30px;text-align:center;margin-bottom:12px;overflow-x:auto;}
.status{text-align:center;margin:12px 0 6px;min-height:22px;font-family:monospace;font-size:13px;color:#555;}
.status.info{color:#185FA5;}.status.ok{color:#1a7a1a;font-weight:600;font-size:14px;}.status.err{color:#b32a2a;}
.move-ctr{text-align:center;font-size:12px;color:#777;margin-bottom:14px;}
.btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
button{padding:8px 18px;cursor:pointer;border:1px solid #aaa;background:white;border-radius:8px;font-size:12px;}
button:hover{background:#f0f0f0;}
.eq-label{text-align:center;font-size:11px;color:#888;margin-top:6px;font-family:monospace;}
.prob-picker{text-align:center;margin-bottom:16px;}
.prob-picker select{padding:5px 10px;font-size:12px;border:1px solid #ccc;border-radius:6px;}
</style></head>
<body>
<h1>Demo Cerillas — Motor | \ / | \ /</h1>
<div class="subt">Modelo propuesto: v1 o1 o2 v2 o3 o4 v3 por posición numeral</div>
<div class="prob-picker">
  <select id="prob-sel" onchange="switchProblem()">
    <option value="II=III+I">Tipo A: II = III + I</option>
    <option value="VI=VII+I">Tipo A: VI = VII + I</option>
    <option value="XI=III+III">Tipo D: XI = III + III</option>
    <option value="I=II+II">Tipo B: I = II + II</option>
    <option value="IV=III+III">Tipo A: IV = III + III</option>
  </select>
</div>
<div class="eq-wrap"><svg id="eq-svg"></svg></div>
<div class="eq-label" id="eq-label">—</div>
<div class="status" id="status">Haz clic en una cerilla para seleccionarla.</div>
<div class="move-ctr">Movimientos: <strong id="mn">0</strong> / 1</div>
<div class="btn-row">
  <button onclick="doReset()">↺ Reiniciar</button>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   SLOT MODEL — | \ / | \ /
   ══════════════════════════════════════════════════════════════
   Each numeral character position has 7 slots:

     v1  o1  o2  v2  o3  o4  v3
     |    \  /   |   \  /   |

   Positions (BW=90, BH=140):
     v1  x=8  (left vertical)
     o1  (8,5)→(46,135)   \ — V left arm, also X left diagonal
     o2  (46,5)→(8,135)   / — X right diagonal (crosses o1 in left half)
     v2  x=46 (center vertical = "hueco" del V)
     o3  (46,5)→(82,135)  \ — X left diagonal in right half
     o4  (82,5)→(46,135)  / — V right arm

   Character fills:
     I  →  [v1]          single left vertical
     V  →  [o1, o4]      full-width V, converge at (46,135), v2=empty gap
     X  →  [o1, o2]      cross at (27,70) in left half

   Operators (BW=90, BH=140):
     vC  (45,5)→(45,135)  vertical
     hT  (8,42)→(82,42)   top horizontal
     hM  (8,70)→(82,70)   mid horizontal
     hB  (8,98)→(82,98)   bottom horizontal

     =  → [hT, hB]
     +  → [vC, hM]
     -  → [hM]
══════════════════════════════════════════════════════════════ */

const BW = 90, BH = 140;

const NUM_SLOTS = {
  v1: {x1:8,  y1:5,  x2:8,  y2:135},
  o1: {x1:8,  y1:5,  x2:46, y2:135},  // \ V-left / X-left
  o2: {x1:46, y1:5,  x2:8,  y2:135},  // / X-right (crosses o1)
  v2: {x1:46, y1:5,  x2:46, y2:135},
  o3: {x1:46, y1:5,  x2:82, y2:135},  // \ X-right-half-left
  o4: {x1:82, y1:5,  x2:46, y2:135},  // / V-right
  v3: {x1:82, y1:5,  x2:82, y2:135},
};

const OP_SLOTS = {
  vC: {x1:45, y1:5,  x2:45, y2:135},
  hT: {x1:8,  y1:42, x2:82, y2:42},
  hM: {x1:8,  y1:70, x2:82, y2:70},
  hB: {x1:8,  y1:98, x2:82, y2:98},
};

const CHAR_DEF = {
  'I': {type:'num', filled:['v1']},
  'V': {type:'num', filled:['o1','o4']},
  'X': {type:'num', filled:['o1','o2']},
  '=': {type:'op',  filled:['hT','hB']},
  '+': {type:'op',  filled:['vC','hM']},
  '-': {type:'op',  filled:['hM']},
};

const GAP_REG = 6;
const GAP_OP  = 22;
const PAD     = 24;

/* ─── State ─── */
let TOKENS = [];
let slots = [];
let selUid = -1;
let movesDone = 0;

function loadEquation(eqStr) {
  TOKENS = eqStr.split('');
  buildState();
  selUid = -1;
  movesDone = 0;
  document.getElementById('mn').textContent = '0';
  document.getElementById('eq-label').textContent = 'Ecuación: ' + eqStr.replace(/=/g,' = ').replace(/\+/g,' + ').replace(/-/g,' - ');
  setStatus('Haz clic en una cerilla para seleccionarla.', '');
  render();
}

function buildState() {
  slots = [];
  let uid = 0;
  TOKENS.forEach((ch, ti) => {
    const def = CHAR_DEF[ch];
    const defs = def.type === 'num' ? NUM_SLOTS : OP_SLOTS;
    Object.entries(defs).forEach(([sid, c]) => {
      slots.push({uid:uid++, ti, sid, type:def.type,
                  x1:c.x1, y1:c.y1, x2:c.x2, y2:c.y2,
                  filled: def.filled.includes(sid)});
    });
  });
}

/* ─── Layout ─── */
function getOffsets() {
  const off = [];
  let cx = PAD;
  TOKENS.forEach((ch, ti) => {
    if (ti > 0) {
      const prev = TOKENS[ti-1];
      const isOp = c => c === '=' || c === '+' || c === '-';
      cx += (isOp(prev) || isOp(ch)) ? GAP_OP : GAP_REG;
    }
    off.push(cx);
    cx += BW;
  });
  return {off, totalW: cx + PAD};
}

/* ─── Render ─── */
const NS = 'http://www.w3.org/2000/svg';

function render() {
  const svg = document.getElementById('eq-svg');
  svg.innerHTML = '';
  const {off, totalW} = getOffsets();
  svg.setAttribute('width', totalW);
  svg.setAttribute('height', BH + 10);
  svg.style.display = 'inline-block';

  const hasSel = selUid >= 0;
  const byToken = {};
  slots.forEach(s => { (byToken[s.ti] = byToken[s.ti]||[]).push(s); });

  TOKENS.forEach((ch, ti) => {
    const ox = off[ti], oy = 5;
    const ts = byToken[ti] || [];

    // Drop zones first (behind sticks)
    if (hasSel) {
      ts.forEach(sl => {
        if (!sl.filled) drawDrop(svg, sl, ox, oy);
      });
    }
    // Sticks on top
    ts.forEach(sl => {
      if (sl.filled) drawStick(svg, sl, ox, oy, sl.uid === selUid);
    });
  });
}

function drawStick(svg, sl, ox, oy, sel) {
  const g = document.createElementNS(NS, 'g');
  g.style.cursor = 'pointer';

  // Hit area (wider, invisible)
  g.appendChild(mkLn(ox+sl.x1, oy+sl.y1, ox+sl.x2, oy+sl.y2, 'transparent', 26));

  // Body
  const body = mkLn(ox+sl.x1, oy+sl.y1, ox+sl.x2, oy+sl.y2,
                    sel ? '#f5b73b' : '#c8832a', 10);
  body.setAttribute('stroke-linecap', 'round');
  g.appendChild(body);

  // Head circle
  const hd = document.createElementNS(NS, 'circle');
  hd.setAttribute('cx', ox+sl.x1); hd.setAttribute('cy', oy+sl.y1);
  hd.setAttribute('r', '7');
  hd.setAttribute('fill', sel ? '#fff' : '#cc3311');
  g.appendChild(hd);

  if (sel) g.style.filter = 'drop-shadow(0 0 10px rgba(255,220,80,0.95))';
  g.addEventListener('click', e => { e.stopPropagation(); onPick(sl.uid); });
  svg.appendChild(g);
}

function drawDrop(svg, sl, ox, oy) {
  const g = document.createElementNS(NS, 'g');
  g.style.cursor = 'pointer';

  // Hit area
  g.appendChild(mkLn(ox+sl.x1, oy+sl.y1, ox+sl.x2, oy+sl.y2, 'transparent', 26));

  // Dashed green line
  const dash = mkLn(ox+sl.x1, oy+sl.y1, ox+sl.x2, oy+sl.y2, 'rgba(50,180,70,0.45)', 8);
  dash.setAttribute('stroke-linecap', 'round');
  dash.setAttribute('stroke-dasharray', '12 8');
  g.appendChild(dash);

  // Head dot
  const dot = document.createElementNS(NS, 'circle');
  dot.setAttribute('cx', ox+sl.x1); dot.setAttribute('cy', oy+sl.y1);
  dot.setAttribute('r', '5'); dot.setAttribute('fill', 'rgba(50,180,70,0.45)');
  g.appendChild(dot);

  g.addEventListener('mouseenter', () => {
    dash.setAttribute('stroke', 'rgba(50,180,70,0.85)');
    dot.setAttribute('fill', 'rgba(50,180,70,0.85)');
  });
  g.addEventListener('mouseleave', () => {
    dash.setAttribute('stroke', 'rgba(50,180,70,0.45)');
    dot.setAttribute('fill', 'rgba(50,180,70,0.45)');
  });
  g.addEventListener('click', e => { e.stopPropagation(); onDrop(sl.uid); });
  svg.appendChild(g);
}

function mkLn(x1,y1,x2,y2,stroke,width) {
  const l = document.createElementNS(NS,'line');
  l.setAttribute('x1',x1); l.setAttribute('y1',y1);
  l.setAttribute('x2',x2); l.setAttribute('y2',y2);
  l.setAttribute('stroke',stroke); l.setAttribute('stroke-width',width);
  return l;
}

/* ─── Interaction ─── */
function onPick(uid) {
  if (movesDone >= 1) { setStatus('Ya usaste el movimiento. ↺ Reiniciar.','err'); return; }
  if (selUid === uid) { selUid=-1; setStatus('Selección cancelada.',''); render(); return; }
  selUid = uid;
  setStatus('Cerilla seleccionada ✦ Clic en hueco verde para moverla.','info');
  render();
}

function onDrop(uid) {
  if (selUid < 0) return;
  const src = slots.find(s=>s.uid===selUid);
  const dst = slots.find(s=>s.uid===uid);
  if (!src||!dst||dst.filled||src.uid===dst.uid) return;
  src.filled = false; dst.filled = true;
  selUid = -1; movesDone++;
  document.getElementById('mn').textContent = movesDone;
  render();
  const eq = readEq();
  document.getElementById('eq-label').textContent = 'Resultado: ' + eq;
  if (validateEq(eq)) setStatus('✓ ¡Correcto! ' + eq, 'ok');
  else setStatus('Ecuación actual: ' + eq + ' ← ¿Correcto?', '');
}

/* ─── Equation reading ─── */
function readEq() {
  const byToken = {};
  slots.forEach(s => { (byToken[s.ti]=byToken[s.ti]||[]).push(s); });
  return TOKENS.map((ch, ti) => {
    const filled = (byToken[ti]||[]).filter(s=>s.filled).map(s=>s.sid).sort();
    return slotsToChar(filled, (byToken[ti]||[])[0]?.type||'num');
  }).join('');
}

function slotsToChar(ids, type) {
  if (ids.length === 0) return '';

  if (type === 'op') {
    const vh = ids.filter(id=>id==='vC').length;
    const hh = ids.filter(id=>id.startsWith('h')).length;
    if (vh===1 && hh>=1) return '+';
    if (hh>=2 && vh===0) return '=';
    if (hh===1 && vh===0) return '-';
    if (vh===1 && hh===0) return 'I';
    return '?';
  }

  // Numeral
  const vs = ids.filter(id=>id==='v1'||id==='v2'||id==='v3');
  const ds = ids.filter(id=>id.startsWith('o'));

  if (ds.length===0 && vs.length>0) return 'I'.repeat(vs.length);

  // V: o1 + o4
  if (ds.includes('o1')&&ds.includes('o4')&&ds.length===2&&vs.length===0) return 'V';
  // X: o1 + o2, or o3 + o4
  if (ds.includes('o1')&&ds.includes('o2')&&ds.length===2&&vs.length===0) return 'X';
  if (ds.includes('o3')&&ds.includes('o4')&&ds.length===2&&vs.length===0) return 'X';

  // Verts + diags: e.g. VI = V-slots + I-slot in same position
  if (ds.includes('o1')&&ds.includes('o4')) {
    const extra = vs.length;
    return 'V' + 'I'.repeat(extra);
  }
  if ((ds.includes('o1')&&ds.includes('o2'))||(ds.includes('o3')&&ds.includes('o4'))) {
    const extra = vs.length;
    return 'X' + 'I'.repeat(extra);
  }

  // single diagonal alone → ignore (partial state)
  if (ds.length===1 && vs.length===0) return '?';
  if (ds.length===1 && vs.length>0) return 'I'.repeat(vs.length);

  return '?';
}

/* ─── Validator ─── */
function validateEq(eq) {
  if (!eq || eq.includes('?')) return false;
  const sides = eq.split('=');
  if (sides.length < 2) return false;

  const values = sides.map(evalRomanExpr);
  if (values.some(v => v === null || v <= 0)) return false;
  return values.every(v => v === values[0]);
}

function evalRomanExpr(expr) {
  const clean = expr.trim();
  if (!clean) return null;
  if (!/^[IVXLCDM+\-\s]+$/i.test(clean)) return null;

  const parts = clean.split(/([+\-])/).map(p => p.trim()).filter(Boolean);
  if (parts.length === 0 || parts.length % 2 === 0) return null;

  let total = parseRoman(parts[0]);
  if (total <= 0) return null;

  for (let i = 1; i < parts.length; i += 2) {
    const op = parts[i];
    const term = parseRoman(parts[i + 1]);
    if (term <= 0) return null;
    total = op === '+' ? total + term : total - term;
  }
  return total;
}

function parseRoman(s) {
  if(!s) return 0;
  s = s.trim().toUpperCase();
  const m={I:1,V:5,X:10,L:50,C:100};
  if (!/^[IVXLCDM]+$/.test(s)) return -1;
  if (!/^M{0,3}(CM|CD|D?C{0,3})?(XC|XL|L?X{0,3})?(IX|IV|V?I{0,3})?$/.test(s)) return -1;
  let v=0;
  for(let i=0;i<s.length;i++){
    const c=m[s[i]]; if(c===undefined) return -1;
    const n=m[s[i+1]]||0;
    if(n>c){v+=n-c;i++;}else v+=c;
  }
  return v;
}

/* ─── Controls ─── */
function setStatus(msg,cls) {
  const el=document.getElementById('status');
  el.textContent=msg; el.className='status'+(cls?' '+cls:'');
}
function doReset() {
  loadEquation(document.getElementById('prob-sel').value);
}
function switchProblem() {
  loadEquation(document.getElementById('prob-sel').value);
}

/* ─── Start ─── */
loadEquation('II=III+I');
window._T = {slots, onPick, onDrop, readEq, validateEq, doReset, loadEquation,
             getSlots:()=>slots, TOKENS:()=>TOKENS};
</script>
</body></html>
